[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "agentmesh-mcp"
version = "0.1.0"
description = "Per-user OAuth MCP integration for the AgentsLedge marketplace API"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "mcp[cli]>=2.0.0,<3.0.0",
  "httpx>=0.27,<1.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0,<9.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.hatch.build.targets.wheel]
packages = ["src/agentmesh_mcp"]
